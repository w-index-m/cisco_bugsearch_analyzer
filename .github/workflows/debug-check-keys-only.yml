name: Debug quick API key check only

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests deepl groq
      - name: Check API key connectivity (diagnostic only)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CISCO_PSIRT_CLIENT_ID: ${{ secrets.CISCO_PSIRT_CLIENT_ID }}
          CISCO_PSIRT_CLIENT_SECRET: ${{ secrets.CISCO_PSIRT_CLIENT_SECRET }}
        run: |
          python scripts/check_api_keys.py \
            ${NVD_API_KEY:+--nvd-api-key "$NVD_API_KEY"} \
            ${DEEPL_API_KEY:+--deepl-api-key "$DEEPL_API_KEY"} \
            ${GROQ_API_KEY:+--groq-api-key "$GROQ_API_KEY"} \
            ${OPENROUTER_API_KEY:+--openrouter-api-key "$OPENROUTER_API_KEY"} \
            ${CISCO_PSIRT_CLIENT_ID:+--cisco-psirt-client-id "$CISCO_PSIRT_CLIENT_ID"} \
            ${CISCO_PSIRT_CLIENT_SECRET:+--cisco-psirt-client-secret "$CISCO_PSIRT_CLIENT_SECRET"}
