name: Debug FortiGate/PaloAlto NVD keyword precision check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check keyword precision (diagnostic only)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python scripts/debug_fortigate_paloalto_precision.py \
            ${NVD_API_KEY:+--nvd-api-key "$NVD_API_KEY"}
