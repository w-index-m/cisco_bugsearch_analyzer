name: Debug FortiOS recommended release URL check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Check FortiOS recommended release URL (diagnostic only)
        run: python scripts/debug_fortios_recommended_release.py
