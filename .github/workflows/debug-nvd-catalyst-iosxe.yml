name: Debug NVD Catalyst9300/IOSXE query

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Probe NVD keywordSearch variants
        run: python scripts/debug_nvd_catalyst_iosxe.py
