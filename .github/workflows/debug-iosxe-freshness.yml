name: Debug IOS XE data freshness check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check IOS XE data freshness (diagnostic only)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          PSIRT_CLIENT_ID: ${{ secrets.PSIRT_CLIENT_ID }}
          PSIRT_CLIENT_SECRET: ${{ secrets.PSIRT_CLIENT_SECRET }}
        run: |
          python scripts/debug_iosxe_freshness.py \
            ${NVD_API_KEY:+--nvd-api-key "$NVD_API_KEY"}
