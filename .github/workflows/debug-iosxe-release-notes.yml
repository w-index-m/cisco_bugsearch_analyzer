name: Debug IOS XE release notes scraping feasibility

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Check IOS XE release notes page (diagnostic only)
        run: python scripts/debug_iosxe_release_notes.py
