name: Debug FortiGuard PSIRT RSS feed

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Probe FortiGuard RSS feed
        run: python scripts/debug_fortiguard_rss.py
